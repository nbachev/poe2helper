name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Показать, что лежит в репозитории
        shell: pwsh
        run: Get-ChildItem -Recurse -Depth 2 -Name | Select-Object -First 80

      - name: Найти корень проекта
        id: locate
        shell: pwsh
        run: |
          $spec = Get-ChildItem -Recurse -Filter poe2helper.spec |
                  Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $spec) {
            throw "poe2helper.spec не найден. Похоже, исходники не загружены в репозиторий."
          }
          $dir = $spec.Directory.FullName
          Write-Host "Корень проекта: $dir"
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.7,<7" "requests>=2.31,<3" "pyinstaller>=6.6,<7"

      - name: Нарисовать иконку
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python tools/make_icon.py

      - name: Тесты (логика + сборка окон вхолостую)
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Собрать exe
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python -m PyInstaller poe2helper.spec --noconfirm --clean
